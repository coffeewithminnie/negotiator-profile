<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's Your Negotiation Style?</title>
  <meta property="og:title" content="What's Your Negotiation Style? — Coffee with Minnie" />
  <meta property="og:description" content="Twelve real workplace scenarios. Five negotiation styles. Find out which one you default to, and the one tactic to practice this week." />
  <meta property="og:image" content="https://raw.githubusercontent.com/coffeewithminnie/negotiationquiz/main/Cover.png" />
  <meta property="og:url" content="https://coffeewithminnie.github.io/negotiationquiz/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://raw.githubusercontent.com/coffeewithminnie/negotiationquiz/main/Cover.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f4f0; min-height: 100vh; display: flex; align-items: flex-start;
      justify-content: center; padding: 2rem 1rem 4rem; color: #1a1a18;
    }
    .card { background: #fff; border-radius: 16px; border: 0.5px solid #e0dfd8; padding: 2.5rem 2rem; width: 100%; max-width: 620px; }
    .brand { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: #888780; text-transform: uppercase; margin-bottom: 2rem; }

    /* Intro */
    .intro-title { font-size: 26px; font-weight: 500; line-height: 1.3; margin-bottom: 0.75rem; }
    .intro-sub { font-size: 15px; color: #5f5e58; line-height: 1.7; margin-bottom: 1.5rem; }
    .intro-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.75rem; }
    .intro-meta span { font-size: 12px; padding: 4px 10px; border-radius: 8px; border: 0.5px solid #c8c7c0; color: #888780; }
    .style-preview { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 1.75rem; }
    .style-chip { border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 12px; font-weight: 500; line-height: 1.3; }
    .style-chip .ic { font-size: 20px; display: block; margin-bottom: 4px; }

    .progress-bar-bg { height: 4px; background: #e0dfd8; border-radius: 2px; margin-bottom: 2rem; }
    .progress-bar-fill { height: 4px; background: #1a1a18; border-radius: 2px; transition: width 0.4s ease; }
    .q-label { font-size: 12px; color: #888780; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .q-text { font-size: 20px; font-weight: 500; color: #1a1a18; margin-bottom: 1.5rem; line-height: 1.5; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .opt { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 0.5px solid #c8c7c0; border-radius: 12px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    .opt:hover { background: #f5f4f0; }
    .opt.selected { border: 1.5px solid #1a1a18; background: #f5f4f0; }
    .opt-letter { font-size: 12px; font-weight: 500; color: #888780; min-width: 18px; margin-top: 2px; }
    .opt.selected .opt-letter { color: #1a1a18; }
    .opt-text { font-size: 15px; color: #1a1a18; line-height: 1.5; }
    .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
    .skip-note { font-size: 12px; color: #888780; text-align: center; }
    button { padding: 10px 22px; border: 0.5px solid #c8c7c0; border-radius: 8px; background: transparent; color: #1a1a18; font-size: 14px; font-family: inherit; cursor: pointer; transition: background 0.15s; }
    button:hover { background: #f5f4f0; }
    button:disabled { opacity: 0.3; cursor: default; }
    button.primary { background: #1a1a18; color: #fff; border-color: #1a1a18; }
    button.primary:hover { opacity: 0.85; background: #1a1a18; }

    /* Gate */
    .gate-wrap { border: 0.5px solid #e0dfd8; border-radius: 16px; padding: 2rem 1.5rem; background: #fff; }
    .gate-icon { font-size: 28px; margin-bottom: 1rem; }
    .gate-title { font-size: 20px; font-weight: 500; margin-bottom: 0.5rem; }
    .gate-sub { font-size: 14px; color: #888780; line-height: 1.6; margin-bottom: 1.5rem; }
    .gate-field { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
    .gate-field input { width: 100%; padding: 10px 14px; font-size: 15px; font-family: inherit; border: 0.5px solid #c8c7c0; border-radius: 8px; background: #fff; color: #1a1a18; }
    .gate-field input:focus { outline: none; border-color: #1a1a18; }
    .gate-field input.error { border-color: #E24B4A; }
    .error-msg { font-size: 12px; color: #E24B4A; display: none; }
    .error-msg.visible { display: block; }
    .gate-btn { width: 100%; text-align: center; padding: 12px; font-size: 15px; }
    .gate-privacy { font-size: 11px; color: #888780; margin-top: 0.75rem; text-align: center; }
    .gate-skip { font-size: 12px; color: #888780; text-align: center; margin-top: 1rem; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    .gate-skip:hover { color: #1a1a18; }

    /* Result */
    .result-card { border: 0.5px solid #e0dfd8; border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; background: #fff; }
    .badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 8px; margin-bottom: 0.75rem; }
    .type-head { display: flex; align-items: center; gap: 14px; margin-bottom: 0.25rem; }
    .type-icon { font-size: 34px; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .type-name { font-size: 24px; font-weight: 500; }
    .type-axis { font-size: 12px; color: #888780; margin-top: 2px; }
    .type-tagline { font-size: 15px; color: #5f5e58; margin: 0.75rem 0 1rem; font-style: italic; }
    .type-desc { font-size: 15px; line-height: 1.7; margin-bottom: 1rem; }
    .section-label { font-size: 12px; color: #888780; margin-bottom: 0.5rem; letter-spacing: 0.03em; }
    .trait-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .trait-tag { font-size: 12px; padding: 4px 10px; border-radius: 8px; border: 0.5px solid #c8c7c0; color: #888780; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
    .mini { border: 0.5px solid #e0dfd8; border-radius: 12px; padding: 1rem; }
    .mini h4 { font-size: 13px; font-weight: 500; margin-bottom: 0.4rem; }
    .mini p { font-size: 14px; line-height: 1.6; color: #3a3a38; }
    .try { background: #3a3a38; color: #f5f4f0; border-radius: 12px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; }
    .try .k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #c8c7c0; margin-bottom: 0.4rem; }
    .try .tactic { font-size: 15px; font-weight: 500; margin-bottom: 0.35rem; }
    .try p { font-size: 14px; line-height: 1.65; color: #e9e8e2; }
    .map-wrap { border: 0.5px solid #e0dfd8; border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; }
    .map-wrap svg { width: 100%; height: auto; display: block; }
    .map-note { font-size: 12px; color: #888780; line-height: 1.6; margin-top: 0.5rem; }
    .runner-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 0.5px solid #e0dfd8; }
    .runner-row:last-child { border-bottom: none; }
    .runner-name { font-size: 14px; min-width: 128px; }
    .runner-bar-wrap { flex: 1; margin: 0 12px; height: 6px; background: #ecebe5; border-radius: 3px; }
    .runner-bar { height: 6px; border-radius: 3px; }
    .runner-pct { font-size: 13px; color: #888780; min-width: 36px; text-align: right; }
    .cta { display: flex; align-items: center; gap: 16px; margin-top: 0.75rem; padding: 1.1rem 1.25rem; border: 0.5px solid #e0dfd8; border-radius: 16px; background: #fff; text-decoration: none; color: #1a1a18; transition: background 0.15s; }
    .cta:hover { background: #f5f4f0; }
    .cta .ic { font-size: 26px; width: 52px; height: 52px; border-radius: 50%; background: #f5f4f0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .cta img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .cta .k { font-size: 13px; color: #888780; margin-bottom: 2px; }
    .cta .t { font-size: 16px; font-weight: 500; margin-bottom: 3px; }
    .cta .d { font-size: 13px; color: #888780; line-height: 1.5; }
    .footnote { font-size: 11px; color: #888780; line-height: 1.6; margin-top: 1.5rem; text-align: center; }
    @media (max-width: 500px) {
      .card { padding: 1.5rem 1rem; }
      .q-text { font-size: 17px; }
      .two-col { grid-template-columns: 1fr; }
      .style-preview { grid-template-columns: repeat(3, 1fr); }
      .runner-name { min-width: 104px; font-size: 13px; }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">Negotiation Style Quiz by CoffeewithMinnie</div>
  <div id="quiz-body"></div>
</div>

<script>
// Five styles from the dual-concern model.
// a = assertiveness (pushing for what you want), c = cooperativeness (caring about what they want), both 0–100.
const types = {
  CLOSER: {
    name: "The Closer", icon: "🎯", a: 85, c: 15, axis: "High push · Lower focus on their side",
    bg: "#FAECE7", fg: "#993C1D", bar: "#C4673F",
    tagline: "You came for the number, and you usually leave with it.",
    desc: "You know what you want before you walk in, and you are comfortable holding a position while the room gets uncomfortable. People rarely talk you out of your walk-away point. That clarity is rare, especially early in a career, and it is why you get results in salary talks, vendor deals and anything with a hard deadline.",
    wins: "One-off deals, urgent calls, and moments when someone has to hold the line so the team doesn't give away too much.",
    costs: "Long relationships. A deal agreed on paper can still stall when the other side felt rushed or unheard, and they remember it next round.",
    tactic: "Emotional labeling",
    tryText: "Before your next push, name what the other side seems to be feeling: “It sounds like this timeline is putting real pressure on your team.” Then pause. You give up nothing on the number, and you often find out what is actually blocking the yes.",
    traits: ["Clear walk-away", "Decisive", "Comfortable with tension", "Deadline-driven", "Results-first"]
  },
  ARCHITECT: {
    name: "The Architect", icon: "🧩", a: 85, c: 85, axis: "High push · High focus on their side",
    bg: "#E1F5EE", fg: "#0F6E56", bar: "#2E8C70",
    tagline: "You redesign the deal until both sides get more than they walked in with.",
    desc: "You don't accept that one side has to lose. You ask questions until you understand what the other person actually needs, and then you look for trades that cost you little and mean a lot to them: timing, scope, credit, visibility. This is the style most negotiation classes teach as the goal, and it is the hardest one for AI to replicate.",
    wins: "Complex, high-stakes deals with many stakeholders, and any relationship you'll be negotiating inside of again next year.",
    costs: "Time and energy. Not every conversation needs a redesign, and the other side may want a quick answer more than a perfect one.",
    tactic: "Know when to close",
    tryText: "Pick one low-stakes negotiation this week and settle it in a single conversation. Name the trade you want, propose it in the first ten minutes, and let “good and done” be the win.",
    traits: ["Asks first", "Creates value", "Long-term thinker", "Creative trades", "Win-win"]
  },
  DEALMAKER: {
    name: "The Dealmaker", icon: "🤝", a: 50, c: 50, axis: "Middle push · Middle focus on their side",
    bg: "#FAEEDA", fg: "#854F0B", bar: "#B9802B",
    tagline: "Fair, fast, done.",
    desc: "You are practical. You see where both sides stand, find the middle, and get everyone moving again. Teams love working with you because things don't drag, and nobody leaves feeling taken advantage of. You treat negotiation as a means to an end, and you care more about momentum than about squeezing out the last dollar.",
    wins: "When time matters more than optimizing, when both sides are roughly equal in power, and as a fallback when a deeper solution isn't working.",
    costs: "Value left on the table. Splitting the difference is quick, but it can miss a trade that would have given both sides more.",
    tactic: "One more question before the midpoint",
    tryText: "Before you offer to meet in the middle, ask: “What matters most to you here besides the number?” If the answer is something cheap for you to give, trade that instead of splitting the difference.",
    traits: ["Pragmatic", "Fast", "Even-handed", "Momentum", "Low drama"]
  },
  DIPLOMAT: {
    name: "The Diplomat", icon: "🕊️", a: 15, c: 85, axis: "Lower push · High focus on their side",
    bg: "#EEEDFE", fg: "#534AB7", bar: "#6E66C9",
    tagline: "You protect the relationship, sometimes at your own expense.",
    desc: "People trust you. You read the room, you care how others feel, and you make it easy to work with you. That goodwill compounds, and many people end up as your sponsors because of it. The trade-off is that you sometimes give ground before anyone has asked you to, because the discomfort of tension costs you more than the concession does.",
    wins: "When the relationship clearly matters more than the issue, when you're wrong, or when a small give now earns a big favor later.",
    costs: "Your own asks. Salary, scope and credit drift away quietly, and people may stop expecting you to push back.",
    tactic: "Effective silence",
    tryText: "The next time you state an ask or a number, count to five in your head before saying anything else. Don't soften it, don't add “but I'm flexible.” Let the other person fill the silence.",
    traits: ["Trusted", "Reads the room", "Generous", "Relationship-first", "Calm"]
  },
  OBSERVER: {
    name: "The Observer", icon: "🔭", a: 15, c: 15, axis: "Lower push · Lower focus on their side",
    bg: "#E6F1FB", fg: "#185FA5", bar: "#3F7FBF",
    tagline: "You pick your battles, and you pick your moment.",
    desc: "You don't get pulled into every fight, and you're rarely the one who escalates something that didn't need it. You like to gather information, let emotions cool, and come back when the timing is better. In fast-moving workplaces this restraint is underrated, because many conflicts resolve on their own.",
    wins: "Low-stakes issues, heated moments that need a cooling-off period, and situations where you need more information first.",
    costs: "Issues that don't go away. Problems you step back from can grow quietly, and others may make decisions in the room without you.",
    tactic: "Mirroring",
    tryText: "In your next tense conversation, stay in it with one small move: repeat the last two or three words the other person said, as a question, and wait. “Too risky?” It keeps you engaged without escalating, and people usually explain what they really mean.",
    traits: ["Strategic timing", "Composed", "Picks battles", "Information-first", "Low ego"]
  }
};
const ORDER = ["CLOSER", "ARCHITECT", "DEALMAKER", "DIPLOMAT", "OBSERVER"];

const questions = [
  { q: "You believe you're ready for a promotion, but your manager hasn't brought it up. What do you do?", opts: [
    { t: "Book time and make the case: here's what I delivered, here's the title I'm asking for", s: "CLOSER" },
    { t: "Ask what the next level looks like to them, and build a plan together to get there", s: "ARCHITECT" },
    { t: "Propose a middle step now, like a stretch scope or partial raise, with the full promotion next cycle", s: "DEALMAKER" },
    { t: "Focus on making their quarter easier first. They'll notice when the time is right", s: "DIPLOMAT" },
    { t: "Wait for review season. Raising it now feels premature", s: "OBSERVER" },
  ]},
  { q: "A client tells you, “Your price is too high.” Your first move:", opts: [
    { t: "Hold the price, and point out what they'd lose by walking away", s: "CLOSER" },
    { t: "Ask, “Too high compared to what?” and look for what else could make it work: scope, timing, terms", s: "ARCHITECT" },
    { t: "Meet them partway with a discount so you can both move on", s: "DEALMAKER" },
    { t: "Lower it. Keeping the relationship is worth more than this one deal", s: "DIPLOMAT" },
    { t: "Say you'll check internally, and buy yourself time to regroup", s: "OBSERVER" },
  ]},
  { q: "A job offer comes in below what you expected. You:", opts: [
    { t: "Counter high, anchored to market data, and hold firm", s: "CLOSER" },
    { t: "Ask where there's flexibility across base, bonus, title and start date, then trade", s: "ARCHITECT" },
    { t: "Counter at the midpoint between their number and yours", s: "DEALMAKER" },
    { t: "Accept. You don't want to start the relationship on the wrong foot", s: "DIPLOMAT" },
    { t: "Ask for a few days, and hope they come back with more", s: "OBSERVER" },
  ]},
  { q: "In a meeting with senior leaders, a teammate presents your shared work as mostly theirs. You:", opts: [
    { t: "Correct the record on the spot, politely but clearly", s: "CLOSER" },
    { t: "Talk to them afterwards and agree how you'll present joint work from now on", s: "ARCHITECT" },
    { t: "Add a quick line about your part next time you have the floor", s: "DEALMAKER" },
    { t: "Let it go. The team win matters more than whose name is on it", s: "DIPLOMAT" },
    { t: "Say nothing now, and quietly make your work more visible going forward", s: "OBSERVER" },
  ]},
  { q: "You and another team lead both need the same engineer next quarter. You:", opts: [
    { t: "Escalate early with the strongest business case", s: "CLOSER" },
    { t: "Sit down together, map both roadmaps, and find a sequence that works for both teams", s: "ARCHITECT" },
    { t: "Propose splitting their time 50/50", s: "DEALMAKER" },
    { t: "Let the other team have them, and adjust your own plan", s: "DIPLOMAT" },
    { t: "Hold off. Priorities usually shift before the quarter starts", s: "OBSERVER" },
  ]},
  { q: "Someone pushes back hard on your proposal in front of the room. In the next ten seconds you:", opts: [
    { t: "Defend it point by point with data", s: "CLOSER" },
    { t: "Repeat their concern back, “Too risky?”, and dig into what's underneath it", s: "ARCHITECT" },
    { t: "Offer to scale it down to a pilot so it can still move forward", s: "DEALMAKER" },
    { t: "Acknowledge their point and offer to revise it their way", s: "DIPLOMAT" },
    { t: "Suggest taking it offline so the meeting can move on", s: "OBSERVER" },
  ]},
  { q: "You've just made your ask. The other side goes quiet. You:", opts: [
    { t: "Hold the silence. Whoever speaks first gives something up", s: "CLOSER" },
    { t: "Let it sit, then ask what's on their mind", s: "ARCHITECT" },
    { t: "Offer a middle option to keep things moving", s: "DEALMAKER" },
    { t: "Soften it: “But we're flexible, of course”", s: "DIPLOMAT" },
    { t: "Change the subject to ease the tension", s: "OBSERVER" },
  ]},
  { q: "What would a colleague most likely say about how you negotiate?", opts: [
    { t: "“You always know your number.”", s: "CLOSER" },
    { t: "“You find options nobody else saw.”", s: "ARCHITECT" },
    { t: "“You get us to a yes quickly.”", s: "DEALMAKER" },
    { t: "“People leave feeling good about working with you.”", s: "DIPLOMAT" },
    { t: "“You never get dragged into fights that aren't worth it.”", s: "OBSERVER" },
  ]},
  { q: "Which part of negotiating drains you the most?", opts: [
    { t: "Long back-and-forth when the answer seems obvious", s: "CLOSER" },
    { t: "Deals that close fast but leave value on the table", s: "ARCHITECT" },
    { t: "Overanalyzing when meeting in the middle would be fine", s: "DEALMAKER" },
    { t: "Asking for more after they've already said yes to something", s: "DIPLOMAT" },
    { t: "The confrontation itself", s: "OBSERVER" },
  ]},
  { q: "You're negotiating with a counterpart from a business culture you don't know well. You:", opts: [
    { t: "Stick to your playbook: strong opening, clear terms", s: "CLOSER" },
    { t: "Spend the first meeting learning how they make decisions and who else is involved", s: "ARCHITECT" },
    { t: "Propose a standard, middle-of-the-road deal to keep it simple", s: "DEALMAKER" },
    { t: "Follow their lead on pace, process and formality", s: "DIPLOMAT" },
    { t: "Hand it to a colleague who knows that market better", s: "OBSERVER" },
  ]},
  { q: "A vendor misses a deadline that pushes back your launch. You:", opts: [
    { t: "Invoke the penalty clause. That's what it's there for", s: "CLOSER" },
    { t: "Get on a call, find the root cause, and agree a recovery plan with checkpoints", s: "ARCHITECT" },
    { t: "Ask for a partial credit and a firm new date", s: "DEALMAKER" },
    { t: "Reassure them. Things happen, and you'll need them again", s: "DIPLOMAT" },
    { t: "Quietly add buffer to the next timeline and move on", s: "OBSERVER" },
  ]},
  { q: "After a tough negotiation, what makes you feel it went well?", opts: [
    { t: "I got what I came for", s: "CLOSER" },
    { t: "We built something better than either of us walked in with", s: "ARCHITECT" },
    { t: "We both gave a little, and it's done", s: "DEALMAKER" },
    { t: "The relationship is stronger than before", s: "DIPLOMAT" },
    { t: "It got resolved without anything blowing up", s: "OBSERVER" },
  ]},
];

// Vary option order per question so the same style never sits in the same slot.
const PERMS = [[1,3,0,4,2],[2,0,4,1,3],[4,1,3,2,0],[0,2,1,3,4],[3,4,2,0,1],[1,0,3,2,4],[2,4,0,3,1],[4,3,1,0,2],[0,1,4,2,3],[3,2,0,4,1],[1,4,2,3,0],[2,3,4,1,0]];
questions.forEach((q, i) => { q.opts = PERMS[i].map(j => q.opts[j]); });

let answers = new Array(questions.length).fill(null);
let current = 0;
let stage = 'intro';
const letters = ['A','B','C','D','E'];

function render() {
  const body = document.getElementById('quiz-body');
  if (stage === 'intro') renderIntro(body);
  else if (stage === 'quiz') renderQuestion(body);
  else if (stage === 'gate') renderGate(body);
  else renderResult(body);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderIntro(body) {
  body.innerHTML = `
    <div class="intro-title">What's your negotiation style?</div>
    <div class="intro-sub">Everyone has a default way of handling a hard conversation, whether it's a salary offer, a client pushing on price, or a teammate taking credit. This quiz maps yours on two dimensions: how hard you push for what you want, and how much you factor in what the other side wants. You'll get your style, where it helps you and where it costs you, and one tactic to practice this week.</div>
    <div class="style-preview">
      ${ORDER.map(k => `<div class="style-chip" style="background:${types[k].bg};color:${types[k].fg}"><span class="ic">${types[k].icon}</span>${types[k].name.replace('The ','')}</div>`).join('')}
    </div>
    <div class="intro-meta"><span>12 questions</span><span>About 3 minutes</span><span>Pick your first instinct</span></div>
    <button class="primary" style="width:100%;padding:12px;font-size:15px" onclick="start()">Start the quiz →</button>
  `;
}

function start() { stage = 'quiz'; render(); }

function renderQuestion(body) {
  const q = questions[current];
  const pct = (current / questions.length) * 100;
  body.innerHTML = `
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="q-label">Question ${current + 1} of ${questions.length}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">
      ${q.opts.map((o, i) => `
        <div class="opt ${answers[current] === i ? 'selected' : ''}" onclick="selectOpt(${i})">
          <span class="opt-letter">${letters[i]}</span>
          <span class="opt-text">${o.t}</span>
        </div>`).join('')}
    </div>
    <div class="nav">
      <button onclick="go(-1)">Back</button>
      <span class="skip-note">${answers[current] === null ? 'Go with your first instinct' : ''}</span>
      <button class="primary" onclick="go(1)" ${answers[current] === null ? 'disabled' : ''}>${current === questions.length - 1 ? 'See results →' : 'Next'}</button>
    </div>
  `;
}

function selectOpt(i) { answers[current] = i; render(); }

function go(dir) {
  if (dir === -1 && current === 0) { stage = 'intro'; render(); return; }
  if (dir === 1 && current === questions.length - 1) { stage = 'gate'; render(); return; }
  current += dir;
  render();
}

function computeResult() {
  const counts = {}; ORDER.forEach(k => counts[k] = 0);
  answers.forEach((a, i) => { if (a !== null) counts[questions[i].opts[a].s]++; });
  const total = answers.filter(a => a !== null).length || 1;
  // Your position on the map: average of the styles you picked.
  let a = 0, c = 0;
  ORDER.forEach(k => { a += types[k].a * counts[k]; c += types[k].c * counts[k]; });
  a /= total; c /= total;
  // Primary style: most-picked; ties go to the style closest to your position.
  const dist = k => Math.hypot(types[k].a - a, types[k].c - c);
  const sorted = [...ORDER].sort((x, y) => (counts[y] - counts[x]) || (dist(x) - dist(y)));
  return { counts, total, a, c, top: sorted[0], sorted };
}

function renderGate(body) {
  body.innerHTML = `
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:100%"></div></div>
    <div class="gate-wrap">
      <div class="gate-icon">🤝</div>
      <div class="gate-title">Your negotiation style is ready</div>
      <div class="gate-sub">Enter your details to see your style, your map, and the one tactic to practice this week. I'll also send you my notes on negotiating at work, the tactics I learned at MIT Sloan and still use every week.</div>
      <div class="gate-field">
        <input type="text" id="gate-name" placeholder="Your first name" />
        <input type="email" id="gate-email" placeholder="Your email address" />
        <span class="error-msg" id="email-error">Please enter a valid email address.</span>
      </div>
      <button class="primary gate-btn" onclick="submitGate()">Show my style →</button>
      <div class="gate-privacy">No spam. Unsubscribe anytime.</div>
    </div>
    <div class="gate-skip" onclick="skipGate()">Skip and show results without entering email</div>
  `;
}

function submitGate() {
  const name = document.getElementById('gate-name').value.trim();
  const email = document.getElementById('gate-email').value.trim();
  const emailInput = document.getElementById('gate-email');
  const errorMsg = document.getElementById('email-error');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    emailInput.classList.add('error'); errorMsg.classList.add('visible'); return;
  }
  emailInput.classList.remove('error'); errorMsg.classList.remove('visible');
  const r = computeResult();
  fetch('https://formspree.io/f/xaeedblg', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({ name: name, email: email, quiz: 'negotiation-style', style: types[r.top].name })
  }).finally(() => { stage = 'result'; render(); });
}

function skipGate() { stage = 'result'; render(); }

function mapSvg(r) {
  // Plot area: x = cooperativeness, y = assertiveness (higher = up). 0–100 mapped to 260px.
  const L = 56, T = 16, S = 260;
  const px = c => L + (c / 100) * S;
  const py = a => T + (1 - a / 100) * S;
  const top = types[r.top];
  const dots = ORDER.map(k => {
    const t = types[k], x = px(t.c), y = py(t.a);
    const ly = k === 'DEALMAKER' ? y - 16 : (t.a > 50 ? y - 14 : y + 22);
    const tx = k === 'CLOSER' || k === 'OBSERVER' ? x - 12 : k === 'DEALMAKER' ? x : x + 12;
    const ta = k === 'CLOSER' || k === 'OBSERVER' ? 'start' : k === 'DEALMAKER' ? 'middle' : 'end';
    return `<circle cx="${x}" cy="${y}" r="7" fill="${t.bg}" stroke="${t.bar}" stroke-width="1.5"/>
      <text x="${tx}" y="${ly}" text-anchor="${ta}" font-size="11" fill="${t.fg}" font-weight="500">${t.icon} ${t.name.replace('The ','')}</text>`;
  }).join('');
  const ux = px(r.c), uy = py(r.a);
  return `<svg viewBox="0 0 340 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
    <rect x="${L}" y="${T}" width="${S}" height="${S}" fill="#faf9f6" stroke="#e0dfd8" stroke-width="0.75" rx="6"/>
    <line x1="${px(50)}" y1="${T}" x2="${px(50)}" y2="${T+S}" stroke="#e0dfd8" stroke-dasharray="3 4"/>
    <line x1="${L}" y1="${py(50)}" x2="${L+S}" y2="${py(50)}" stroke="#e0dfd8" stroke-dasharray="3 4"/>
    ${dots}
    <circle cx="${ux}" cy="${uy}" r="11" fill="${top.bar}" fill-opacity="0.18"/>
    <circle cx="${ux}" cy="${uy}" r="6" fill="#1a1a18"/>
    <text x="${ux}" y="${uy + 4}" dx="${ux > px(70) ? -14 : 14}" text-anchor="${ux > px(70) ? 'end' : 'start'}" font-size="12" font-weight="600" fill="#1a1a18">You</text>
    <text x="${L + S/2}" y="${T + S + 26}" text-anchor="middle" font-size="11" fill="#888780">Focus on what they want →</text>
    <text x="${L - 30}" y="${T + S/2}" text-anchor="middle" font-size="11" fill="#888780" transform="rotate(-90 ${L - 30} ${T + S/2})">Push for what you want →</text>
    <text x="${L - 6}" y="${T + S + 4}" text-anchor="end" font-size="9" fill="#b4b3ac">low</text>
    <text x="${L - 6}" y="${T + 8}" text-anchor="end" font-size="9" fill="#b4b3ac">high</text>
    <text x="${L + S}" y="${T + S + 13}" text-anchor="end" font-size="9" fill="#b4b3ac">high</text>
  </svg>`;
}

function renderResult(body) {
  const r = computeResult();
  const t = types[r.top];
  const mix = ORDER.slice().sort((x, y) => r.counts[y] - r.counts[x]).map(k => {
    const pct = Math.round((r.counts[k] / r.total) * 100);
    return `<div class="runner-row">
      <span class="runner-name">${types[k].icon} ${types[k].name.replace('The ','')}</span>
      <div class="runner-bar-wrap"><div class="runner-bar" style="width:${pct}%;background:${types[k].bar}"></div></div>
      <span class="runner-pct">${pct}%</span>
    </div>`;
  }).join('');
  body.innerHTML = `
    <div class="result-card">
      <div class="badge" style="background:${t.bg};color:${t.fg}">Your negotiation style</div>
      <div class="type-head">
        <div class="type-icon" style="background:${t.bg}">${t.icon}</div>
        <div><div class="type-name">${t.name}</div><div class="type-axis">${t.axis}</div></div>
      </div>
      <div class="type-tagline">${t.tagline}</div>
      <div class="type-desc">${t.desc}</div>
      <div class="section-label">Your strengths</div>
      <div class="trait-tags">${t.traits.map(x => `<span class="trait-tag">${x}</span>`).join('')}</div>
    </div>

    <div class="two-col">
      <div class="mini"><h4>✅ Where it wins</h4><p>${t.wins}</p></div>
      <div class="mini"><h4>⚠️ Where it costs you</h4><p>${t.costs}</p></div>
    </div>

    <div class="try">
      <div class="k">Do this week</div>
      <div class="tactic">${t.tactic}</div>
      <p>${t.tryText}</p>
    </div>

    <div class="map-wrap">
      <div class="section-label">Your style map</div>
      ${mapSvg(r)}
      <div class="map-note">Your dot is the average of every answer you picked. Most people use one or two styles by default. Strong negotiators can move across all five depending on the situation.</div>
    </div>

    <div class="result-card">
      <div class="section-label" style="margin-bottom:0.25rem">Your mix (share of your 12 answers)</div>
      ${mix}
    </div>

    <div class="nav"><button onclick="restart()">Retake quiz</button></div>

    <a class="cta" href="https://youtu.be/rDcCROjoz_U" target="_blank">
      <div class="ic">▶️</div>
      <div><div class="k">Watch the video</div><div class="t">The skill AI can't replace</div><div class="d">Listening, trust and value creation, plus the negotiation tactics behind this quiz.</div></div>
    </a>
    <a class="cta" href="https://coffeewithminnie.gumroad.com/l/negotiation-guide-2026" target="_blank">
      <div class="ic">📘</div>
      <div><div class="k">Go deeper</div><div class="t">Guide to Negotiation in the Age of AI</div><div class="d">Five crisis-negotiation tools for your next hard conversation.</div></div>
    </a>
    <a class="cta" href="https://www.youtube.com/@coffeewithminnie" target="_blank">
      <img src="https://yt3.googleusercontent.com/k-shy38JsN4dphxTOYWgM_Vdj2Z-lkL1YXf7_pRL7r3iTJMxcb6m5C9fxQi0yfKxdz0LfqvcuQ=s160-c-k-c0x00ffffff-no-rj" alt="Coffee with Minnie" />
      <div><div class="k">Want to learn more?</div><div class="t">Coffee with Minnie ☕</div><div class="d">I help ambitious young leaders navigate international careers, top MBA programs and cross-cultural leadership.</div></div>
    </a>
    <div class="footnote">Based on the dual-concern model of conflict styles (assertiveness × cooperativeness). For self-reflection, not a formal assessment.</div>
  `;
}

function restart() {
  answers = new Array(questions.length).fill(null);
  current = 0; stage = 'intro'; render();
}

render();
</script>
</body>
</html>
